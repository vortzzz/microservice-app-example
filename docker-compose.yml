services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zipkin:
    image: openzipkin/zipkin:2
    ports:
      - "9411:9411"

  users-api:
    build: ./users-api
    ports:
      - "8083:8083"
    environment:
      JWT_SECRET: PRFT
      SERVER_PORT: "8083"
      SPRING_ZIPKIN_BASEURL: http://zipkin:9411/
    depends_on:
      - zipkin

  auth-api:
    build: ./auth-api
    ports:
      - "8000:8000"
    environment:
      AUTH_API_PORT: "8000"
      USERS_API_ADDRESS: http://users-api:8083
      JWT_SECRET: PRFT
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - users-api
      - zipkin

  todos-api:
    build: ./todos-api
    ports:
      - "8082:8082"
    environment:
      TODO_API_PORT: "8082"
      JWT_SECRET: PRFT
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL: log_channel
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - redis
      - zipkin

  log-message-processor:
    build: ./log-message-processor
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CHANNEL: log_channel
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - redis
      - zipkin

  frontend:
    build: ./frontend
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      AUTH_API_ADDRESS: http://auth-api:8000
      TODOS_API_ADDRESS: http://todos-api:8082
      ZIPKIN_URL: http://zipkin:9411/api/v2/spans
    depends_on:
      - auth-api
      - todos-api
